version: '3.8'

services:
  web:
    build: ./app
    command: poetry run gunicorn -c gunicorn.conf.py config.wsgi:application
    restart: unless-stopped
    environment:
      - SECRET_KEY=${SECRET_KEY}
      - DATABASE_URL=${DATABASE_URL}
      - DJANGO_SETTINGS_MODULE=config.settings
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 10s
      timeout: 5s
      retries: 3

  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${NAMEDB}
      POSTGRES_USER: ${USERNAME}
      POSTGRES_PASSWORD: ${PSWD}
    volumes:
      - ./postgres/data:/var/lib/postgresql/data
    ports:
      - "5432:5432"  # можно убрать, если доступ только из контейнеров
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${USERNAME} -d ${PSWD}"]
      interval: 5s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      # - "443:443"  # раскомментируй, когда будет SSL
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      # - ./static:/var/www/static:ro  # если собираешь static отдельно
    depends_on:
      web:
        condition: service_healthy

volumes:
  postgres_data:
