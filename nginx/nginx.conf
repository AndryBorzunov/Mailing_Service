server {
    listen 80;
    server_name _;  # или твой домен: example.com www.example.com

    location /static/ {
        alias /var/www/static/;   # если отдаёшь статику из тома
        autoindex off;
    }

    location /media/ {
        alias /var/www/media/;
        autoindex off;
    }

    location / {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;

        # Увеличиваем таймауты, если есть долгие запросы
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }
}
