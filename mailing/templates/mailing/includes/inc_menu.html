{% load my_tags %}
<div class="d-flex flex-column flex-md-row align-items-center p-3 px-md-4 mb-3 bg-white border-bottom box-shadow">
    <h5 class="my-0 mr-md-auto font-weight-normal">Сервис рассылок</h5>

    <nav class="ms-5">

        {% if user.is_authenticated %}
        <a href="#" data-bs-toggle="dropdown" aria-expanded="false"> <img src="{{ user.avatar | media_filter }}"
                                                                          alt="" width="64" height="64"
                                                                          class="rounded-circle me-2">
            <strong>{{ user.email }}</strong> </a>

        <ul class="p-2 dropdown-menu dropdown-menu-dark text-small shadow" style="">
            <li><a class="dropdown-item" href="{% url 'users:user_profile' user.pk %}">Профиль</a></li>
            <li>
                <hr class="dropdown-divider">
            </li>
            <li><a class="dropdown-item" href="{% url 'users:logout' %}">Выход</a></li>
        </ul>

        <a class="p-2 btn btn-outline-primary" href="{% url 'mailing:dispatch_list' %}">Рассылки</a>
        <a class="p-2 btn btn-outline-primary" href="{% url 'mailing:message_list' %}">Сообщения</a>
        <a class="p-2 btn btn-outline-primary" href="{% url 'mailing:recipient_mails' %}">Получатели</a>
        <a class="p-2 btn btn-outline-primary" href="{% url 'mailing:attempt_list' %}">Статистика</a>
        {% if perms.mailing.can_stop_dispatch %}
        <a class="p-2 btn btn-outline-primary" href="{% url 'users:user_list' %}">Пользователи</a>
        {% endif %}

        <a class="p-2 btn btn-outline-primary" href="{% url 'users:logout' %}">Выход</a>
        {% else %}
        <a class="p-2 btn btn-outline-primary" href="{% url 'users:login' %}">Вход</a>
        <a class="p-2 btn btn-outline-primary" href="{% url 'users:register' %}">Регистрация</a>
        {% endif %}

    </nav>
</div>
